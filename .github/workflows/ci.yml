name: CI

on:
    pull_request:

jobs:
    checks:
        name: Overall CI Checks
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements-dev.txt
                  python -m pip install -e .

            - name: Run Ruff
              run: python -m ruff check .

            - name: Run Black
              run: python -m black --check .

            - name: Run Pytest
              run: |
                  for test_file in tests/test_*.py; do
                      if [[ "${test_file}" == *"_integration.py" ]]; then
                          echo "Skipping ${test_file} in default pytest pass (integration runs in dedicated step)."
                          continue
                      fi
                      echo "Running ${test_file}"
                      python -m pytest -q "${test_file}"
                  done

            - name: Run Integration Lifecycle Tests
              run: |
                  python -m pytest -q -o addopts="" -m integration tests/test_runner_lifecycle_integration.py
